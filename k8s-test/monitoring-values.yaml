prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

grafana:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 25m
      limits:
        memory: 128Mi
        cpu: 100m

# The chart installs its own node-exporter and kube-state-metrics for
# in-cluster metrics — keep these, they're lightweight and monitor the
# Acer/K3s itself, separate from scraping the HP Stream remotely later.
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
