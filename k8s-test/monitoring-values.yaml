prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        memory: 256Mi
        cpu: 150m
      limits:
        memory: 768Mi
        cpu: 500m
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        memory: 256Mi
        cpu: 150m
      limits:
        memory: 768Mi
        cpu: 500m
    additionalScrapeConfigs:
      - job_name: 'hpstream-node-exporter'
        static_configs:
          - targets: ['192.168.1.155:9100']
            labels:
              instance: 'hpstream'
      - job_name: 'hpstream-cadvisor'
        static_configs:
          - targets: ['192.168.1.155:8082']
            labels:
              instance: 'hpstream'

grafana:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 25m
      limits:
        memory: 128Mi
        cpu: 100m

# The chart installs its own node-exporter and kube-state-metrics for
# in-cluster metrics — keep these, they're lightweight and monitor the
# Acer/K3s itself, separate from scraping the HP Stream remotely later.
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
